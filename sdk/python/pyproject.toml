[project]
name = "unsworn"
version = "0.1.0"
description = "Write Unsworn handlers in Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/j4crev/unsworn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unsworn"]
