name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Actions are pinned to commits;
# Dependabot updates the pins.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The `unsworn` binary for servers and containers: lint, the Rust tests
  # (including the conformance suite, which runs every SDK's worker against
  # the binary, so it needs Bun, Node, Python and Go), and the Go SDK.
  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      UNSWORN_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: sdk/go/go.mod
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Go SDK
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - run: cargo test --all

  # macOS is for development: the server builds and runs there, without
  # what it reads from /proc on Linux (see the README). The tests about
  # that are compiled out; the rest run, with every SDK's worker.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: sdk/go/go.mod
      # Every test binary runs, so one failure doesn't hide the next.
      - run: cargo test --no-fail-fast -p unsworn-core -p unsworn-proto -p unsworn

  # The core and the protocol must keep building for wasm32, where the edge
  # and serverless hosts run them. See docs/architecture.md.
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          # Must match the `wasm-bindgen` crate in crates/unsworn-wasm.
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: cargo clippy -p unsworn-core -p unsworn-proto -p unsworn-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p unsworn-core -p unsworn-proto --target wasm32-unknown-unknown --release
      - name: Build the wasm core and check its size
        run: crates/unsworn-wasm/build.sh --check-size
      - run: node --test crates/unsworn-wasm/tests/smoke.test.mjs

  # The Cloudflare target end to end: `unsworn build --target cloudflare`,
  # then the Worker in workerd (Cloudflare's runtime) through wrangler dev.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: crates/unsworn-wasm/build.sh
      - run: cargo build -p unsworn
      - name: Worker tests
        working-directory: tests/cloudflare
        timeout-minutes: 10
        env:
          UNSWORN_BIN: ${{ github.workspace }}/target/debug/unsworn
        run: |
          npm ci --no-audit --no-fund
          node --test worker.test.mjs

  # The serverless targets: the Node host they run on, driven directly,
  # then each target built with `unsworn build` and its function run in
  # plain Node the way the platform calls it.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: crates/unsworn-wasm/build.sh
      - run: cargo build -p unsworn
      - name: Function tests
        working-directory: tests/functions
        timeout-minutes: 10
        env:
          UNSWORN_BIN: ${{ github.workspace }}/target/debug/unsworn
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
