name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      UNSWORN_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sdk/go/go.mod
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Go SDK
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - run: cargo test --all

  # The core and the protocol must keep building for wasm32, where the edge
  # and serverless hosts run them. See docs/architecture.md.
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Must match the `wasm-bindgen` crate in crates/unsworn-wasm.
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo clippy -p unsworn-core -p unsworn-proto -p unsworn-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p unsworn-core -p unsworn-proto --target wasm32-unknown-unknown --release
      - name: Build the wasm core and check its size
        run: crates/unsworn-wasm/build.sh --check-size
      - run: node --test crates/unsworn-wasm/tests/smoke.test.mjs
      # The Cloudflare host end to end, in workerd via wrangler dev.
      - name: Cloudflare Worker tests
        working-directory: tests/cloudflare
        timeout-minutes: 10
        run: |
          npm ci --no-audit --no-fund
          node --test worker.test.mjs
