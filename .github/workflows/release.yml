name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs. Actions are pinned to commits, so a tag
# that's moved later can't change what runs with these permissions;
# Dependabot updates the pins.
permissions: {}

jobs:
  binaries:
    permissions:
      contents: write # upload release assets
      id-token: write # sign the build attestation
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # For development. Both are built on an Apple silicon runner,
          # whose toolchain builds for either.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The Linux binaries are static, built against musl in a container.
      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        if: runner.os == 'Linux'
        run: cross build --profile dist --locked -p unsworn --target "$TARGET"
      - name: Build
        if: runner.os == 'macOS'
        run: cargo build --profile dist --locked -p unsworn --target "$TARGET"
      - name: Package
        run: |
          cd "target/$TARGET/dist"
          tar -czf "unsworn-$TARGET.tar.gz" unsworn
          # macOS has `shasum` where Linux has `sha256sum`; they write the same line.
          if command -v sha256sum >/dev/null; then
            sha256sum "unsworn-$TARGET.tar.gz" > "unsworn-$TARGET.tar.gz.sha256"
          else
            shasum -a 256 "unsworn-$TARGET.tar.gz" > "unsworn-$TARGET.tar.gz.sha256"
          fi
      # Records, signed by GitHub, that this workflow built the archive
      # from this commit. `gh attestation verify` checks it; install.sh
      # does when asked to (UNSWORN_VERIFY=1).
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/${{ matrix.target }}/dist/unsworn-${{ matrix.target }}.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            target/${{ matrix.target }}/dist/unsworn-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/dist/unsworn-${{ matrix.target }}.tar.gz.sha256

  image:
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the image attestation
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
