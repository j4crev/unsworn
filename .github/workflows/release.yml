name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs. Actions are pinned to commits, so a tag
# that's moved later can't change what runs with these permissions;
# Dependabot updates the pins.
permissions: {}

jobs:
  binaries:
    permissions:
      contents: write # upload release assets
      id-token: write # sign the build attestation
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # For development. Both are built on an Apple silicon runner,
          # whose toolchain builds for either.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The Linux binaries are static, built against musl in a container.
      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        if: runner.os == 'Linux'
        run: cross build --profile dist --locked -p unsworn --target "$TARGET"
      - name: Build
        if: runner.os == 'macOS'
        run: cargo build --profile dist --locked -p unsworn --target "$TARGET"
      - name: Package
        run: |
          cd "target/$TARGET/dist"
          tar -czf "unsworn-$TARGET.tar.gz" unsworn
          # macOS has `shasum` where Linux has `sha256sum`; they write the same line.
          if command -v sha256sum >/dev/null; then
            sha256sum "unsworn-$TARGET.tar.gz" > "unsworn-$TARGET.tar.gz.sha256"
          else
            shasum -a 256 "unsworn-$TARGET.tar.gz" > "unsworn-$TARGET.tar.gz.sha256"
          fi
      # Records, signed by GitHub, that this workflow built the archive
      # from this commit. `gh attestation verify` checks it; install.sh
      # does when asked to (UNSWORN_VERIFY=1).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/${{ matrix.target }}/dist/unsworn-${{ matrix.target }}.tar.gz
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            target/${{ matrix.target }}/dist/unsworn-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/dist/unsworn-${{ matrix.target }}.tar.gz.sha256

  image:
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the image attestation
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
