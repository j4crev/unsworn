#:schema ../../schema/unsworn.schema.json
# One handler served both as a route and as an MCP tool.

[server]
listen = "127.0.0.1:8080"

[runtimes.ts]
extensions = [".ts"]
command    = "bun run sdk/js/src/worker.ts"
protocol   = "framed"
workers    = 4
eager      = true

[mcp]
path = "/mcp"

[[route]]
path    = "/text"
method  = "GET"
handler = "sdk/js/conformance/handlers.ts#text"
mcp     = { tool = "text", description = "Says hello" }

[[mcp.tool]]
name        = "echo"
description = "Echoes its arguments, after checking them"
input       = { type = "object", required = ["id", "name"], properties = { id = { type = "integer", minimum = 1 }, name = { type = "string", maxLength = 100 } } }
handler     = "sdk/js/conformance/handlers.ts#echo"
