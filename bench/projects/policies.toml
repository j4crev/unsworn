#:schema ../../schema/unsworn.schema.json
# One static response behind each policy, to price them one at a time.

[server]
listen = "127.0.0.1:8080"

[auth.jwt]
type   = "jwt"
secret = "bench-secret-0123456789abcdef-0123456789"

[auth.key]
type = "api_key"
keys = ["bench-key-0123456789"]

[defaults]
# Not a policy under test: just the same answer everywhere.
headers = { set = { "x-bench" = "1" } }

[[route]]
path    = "/p/none"
respond = { status = 200, json = { ok = true } }

[[route]]
path    = "/p/jwt"
auth    = "jwt"
respond = { status = 200, json = { ok = true } }

[[route]]
path    = "/p/key"
auth    = "key"
respond = { status = 200, json = { ok = true } }

[[route]]
path       = "/p/rate-limit"
rate_limit = { requests = 1000000000, per = "1s", key = "ip" }
respond    = { status = 200, json = { ok = true } }

[[route]]
path    = "/p/cors"
cors    = { origins = ["https://app.example.com"] }
respond = { status = 200, json = { ok = true } }

[[route]]
path    = "/p/params/{id}"
params  = { id = { type = "integer", min = 1 } }
query   = { limit = { type = "integer", default = 20, max = 100 }, q = { type = "string" } }
respond = { status = 200, json = { ok = true } }

# Body schemas only apply to routes that pass the body on, so these two
# proxy to the Go server in bench/servers, which echoes it.
[[route]]
path   = "/p/proxy"
method = "POST"
proxy  = "http://127.0.0.1:9001"

[[route]]
path   = "/p/body"
method = "POST"
body   = "bench/projects/schemas/order.json"
proxy  = "http://127.0.0.1:9001"

[[route]]
path       = "/p/all/{id}"
auth       = "jwt"
rate_limit = { requests = 1000000000, per = "1s", key = "auth.sub" }
cors       = { origins = ["https://app.example.com"] }
params     = { id = { type = "integer", min = 1 } }
query      = { limit = { type = "integer", default = 20, max = 100 }, q = { type = "string" } }
respond    = { status = 200, json = { ok = true } }
