[workspace]
resolver = "3"
members = ["crates/*", "sdk/rust", "bench/handlers"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/j4crev/unsworn"

[workspace.lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
result_large_err = "allow"

# Release builds (`--profile dist`): slower to compile, about a third smaller.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# The WebAssembly core (`crates/unsworn-wasm`): small over fast, since edge
# platforms cap script size and load it on every cold start.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
