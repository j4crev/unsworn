[workspace]
resolver = "3"
members = ["crates/*", "sdk/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/j4crev/unsworn"
# Not published yet. The crate names are free on crates.io (see README "Naming").
publish = false

[workspace.lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
result_large_err = "allow"

# Release builds (`--profile dist`): slower to compile, about a third smaller.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
