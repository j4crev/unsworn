[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/j4crev/unsworn"
# Not published yet. The crate names are free on crates.io (see README "Naming").
publish = false

[workspace.lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
