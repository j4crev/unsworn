[package]
name = "unsworn-wasm"
description = "Unsworn's core as a WebAssembly module for JavaScript hosts: edge isolates and serverless functions."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
percent-encoding = "2.3.2"
serde_json = "1.0.154"
tracing = "0.1.44"
unsworn-core = { version = "0.8.0", path = "../unsworn-core" }
unsworn-proto = { version = "0.8.0", path = "../unsworn-proto" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
js-sys = "0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"

[lints]
workspace = true
