[package]
name = "unsworn-core"
description = "Unsworn's pure routing core: config, matching, validation and dispatch decisions. No I/O."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jsonschema = { version = "0.61.2", default-features = false }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
matchit = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
thiserror = "2.0.21"
toml = "1.2.1"

[lints]
workspace = true
