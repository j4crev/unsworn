[package]
name = "unsworn-core"
description = "Unsworn's pure routing core: config, matching, validation and dispatch decisions. No I/O."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
form_urlencoded = "1.2.2"
hmac = "0.13.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
httpdate = "1.0.3"
ipnet = "2.12.2"
jsonschema = { version = "0.61.2", default-features = false }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
matchit = "0.9.2"
percent-encoding = "2.3.2"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
unsworn-proto = { version = "0.9.0", path = "../unsworn-proto" }

[lints]
workspace = true

# On wasm32-unknown-unknown, `getrandom` (reached through `jsonschema` and
# `jsonwebtoken`) has no randomness source unless one is picked. That target
# means a JavaScript host (edge isolates, serverless shims), so use its
# `crypto.getRandomValues`. Other targets, WASI included, pick their own.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
