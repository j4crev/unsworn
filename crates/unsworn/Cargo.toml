[package]
name = "unsworn"
description = "The Unsworn binary: a sealed, config-driven API router with handlers in any language."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "unsworn"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9.5"
async-compression = { version = "0.4.52", features = ["tokio", "gzip", "brotli", "zstd"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "http2", "webpki-roots", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "client-legacy", "tokio", "http1", "http2", "service"] }
ipnet = "2.12.2"
notify = "8.2.2"
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unsworn-core = { version = "0.1.0", path = "../unsworn-core" }
unsworn-proto = { version = "0.1.0", path = "../unsworn-proto" }

[lints]
workspace = true

[dev-dependencies]
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
tempfile = "3.27.0"
